<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Manage · Admin</title>
    <!-- Apply the saved / system appearance before first paint (no flash). -->
    <script>
      (function () {
        var c = localStorage.getItem('hm-theme');
        if (c === 'dark' || (!c && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
