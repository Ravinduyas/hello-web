version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd hello-web && npm ci
    build:
      commands:
        # Amplify serves the site at the domain root, not under /hello-web/
        # (the GitHub Pages default in vite.config.ts), so override the base.
        - cd hello-web && BASE_PATH=/ npm run build
  artifacts:
    baseDirectory: hello-web/dist
    files:
      - '**/*'
  cache:
    paths:
      - hello-web/node_modules/**/*
