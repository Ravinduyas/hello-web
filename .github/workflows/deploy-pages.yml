name: Deploy hello-web to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab.
  workflow_dispatch:

# Publishing to the gh-pages branch only needs repo write. The official
# actions/deploy-pages route was rejected by the github-pages environment
# ("Branch 'main' is not allowed to deploy"), so this pushes the built site
# to a branch instead, which no environment rule guards.
permissions:
  contents: write

# One deploy at a time; a newer push waits rather than cancelling a live rollout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hello-web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: hello-web

      - name: Type-check
        run: npm run lint
        working-directory: hello-web

      - name: Build
        run: npm run build
        working-directory: hello-web

      # The app uses BrowserRouter and Pages has no rewrite rules. Serving the
      # same document for unknown paths makes /fleet, /book etc. survive a
      # refresh or a direct link.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
        working-directory: hello-web

      # Without this, Pages runs the output through Jekyll, which drops files
      # and folders whose names begin with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll
        working-directory: hello-web

      - name: Publish to gh-pages
        working-directory: hello-web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
