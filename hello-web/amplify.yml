version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify serves the site at the domain root, not under /hello-web/
        # (the GitHub Pages default in vite.config.ts), so override the base.
        - BASE_PATH=/ npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
