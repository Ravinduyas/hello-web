<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Rent | Scooter & Bike Rentals</title>

    <!-- Without these the browser asks for /favicon.ico on every page and gets
         a 404. %BASE_URL% rather than a leading slash: the site is served from
         a sub-path on GitHub Pages, and Vite substitutes the real base here. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%favicon-180.png" />
    <meta name="theme-color" content="#B0764F" />

    <!-- Fetched in parallel with the stylesheet rather than after it, and
         preconnected so the TLS handshake is already done when the request
         goes out. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
